# Pre-commit hooks — code that does not pass these cannot be committed.
# Install once with:  pre-commit install
repos:
  # --- Formatting -------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  # --- Linting ----------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]

  # --- Type checking ----------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, numpy]
        files: ^backend/

  # --- Secret detection -------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # --- General hygiene --------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]   # keep sample audio out of git history
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
