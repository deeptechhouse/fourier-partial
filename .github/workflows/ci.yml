name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Merge to `main` is blocked unless every job below passes.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install system audio libraries
        # soundfile needs libsndfile at the OS level.
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --- 1. Lint --------------------------------------------------------
      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Format check (black)
        run: black --check backend tests

      # --- 2. Type-check --------------------------------------------------
      - name: Type check (mypy)
        run: mypy backend

      # --- 3. Test --------------------------------------------------------
      # Includes the reconstruction invariant test: sum(tracks) must equal
      # the original bit-exactly. See TDD §7 and tests/test_reconstruction.py.
      - name: Test with coverage
        run: pytest

      # --- 4. Security audit ----------------------------------------------
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --strict

      # --- 5. Build -------------------------------------------------------
      - name: Import smoke test
        run: python -c "import backend.main"
